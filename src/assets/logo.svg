<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="logoGradient" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4285F4" />
      <stop offset="100%" stop-color="#1967D2" />
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="24" fill="url(#logoGradient)"/>
  
  <!-- Top Element: Star and Line -->
  <g transform="translate(0, -5)">
    <path d="M28 25L30.5 30.5L36 33L30.5 35.5L28 41L25.5 35.5L20 33L25.5 30.5L28 25Z" fill="white" fill-opacity="0.95"/>
    <rect x="42" y="27" width="35" height="12" rx="6" fill="white" fill-opacity="0.95"/>
  </g>

  <!-- Bottom Element: Taller Waveform -->
  <!-- Bottom positions preserved relative to group (y+h = constant) -->
  <g transform="translate(0, 5)">
    <!-- Medium: Bottom 74. Was y=56 h=18. Now h=24 y=50. -->
    <rect x="25" y="50" width="8" height="24" rx="4" fill="white"/>
    <!-- Long: Bottom 80. Was y=50 h=30. Now h=40 y=40. -->
    <rect x="46" y="40" width="8" height="40" rx="4" fill="white"/>
    <!-- Short: Bottom 70. Was y=60 h=10. Now h=14 y=56. -->
    <rect x="67" y="56" width="8" height="14" rx="4" fill="white"/>
  </g>
</svg>
